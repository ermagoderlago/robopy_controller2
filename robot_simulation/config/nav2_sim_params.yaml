# ==============================================================================
# nav2_sim_params.yaml — Stack Nav2 Completo per Marcus in Gazebo Harmonic
# Allineato 1:1 a nav2_params_jazzy.yaml + use_sim_time: true + SPEC-01/SPEC-02
# ==============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    transform_tolerance: 2.0
    bt_loop_duration: 10
    default_server_timeout: 40
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    default_nav_to_pose_bt_xml: "/tmp/nav2_survival_bt.xml"
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - backup_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.02
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.02
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    current_progress_checker: "progress_checker"
    current_goal_checker: "general_goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.03
      movement_time_allowance: 35.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.28
      yaw_goal_tolerance: 0.45

    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785
      angular_disengage_threshold: 0.38
      forward_sampling_distance: 0.45
      rotate_to_heading_angular_vel: 1.15
      max_angular_accel: 3.0
      simulate_ahead_time: 0.4
      rotate_to_heading_once: false
      rotate_to_goal_heading: true
      closed_loop: true
      motion_model: "DiffDrive"
      time_steps: 25
      model_dt: 0.10
      batch_size: 250
      vx_std: 0.14
      vy_std: 0.0
      wz_std: 0.42
      vx_max: 0.34
      vx_min: 0.0
      wz_max: 1.25
      kinematics:
        base_min_turning_radius: 0.0
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 2.5
        threshold_to_consider: 0.5
      ObstaclesCritic:
        cost_power: 1
        cost_weight: 20.0
        repulsion_weight: 2.2
        critical_cost: 254.0
      PathAlignCritic:
        cost_power: 1
        cost_weight: 7.0
      PathFollowCritic:
        cost_power: 1
        cost_weight: 11.0
      PathAngleCritic:
        cost_power: 1
        cost_weight: 3.2
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.65
        mode: 0
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 35.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      transform_tolerance: 2.0
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.18
      plugins: ["obstacle_layer", "range_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: scan semantic_objects hailo_semantic_objects
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
        semantic_objects:
          topic: /visual_objects_pc
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
        hailo_semantic_objects:
          topic: /hailo_semantic_obstacles_pc
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        clear_threshold: 0.46
        mark_threshold: 0.98
        clear_on_max_reading: true
        phi: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.2
        inflation_radius: 0.42

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.5
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      transform_tolerance: 2.0
      robot_radius: 0.18
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      plugins: ["static_layer", "obstacle_layer", "range_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: scan semantic_objects hailo_semantic_objects
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
        semantic_objects:
          topic: /visual_objects_pc
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
        hailo_semantic_objects:
          topic: /hailo_semantic_obstacles_pc
          max_obstacle_height: 2.0
          clearing: false
          marking: true
          data_type: "PointCloud2"
      range_layer:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: true
        topics: ["/ultrasonic_range"]
        clear_threshold: 0.46
        mark_threshold: 0.98
        clear_on_max_reading: true
        phi: 0.1
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.2
        inflation_radius: 0.42

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    use_sim_time: true
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.30
      allow_unknown: true
      use_astar: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 2.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.6
    min_rotational_vel: 0.6
    rotational_acc_lim: 3.2

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_nav"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.8
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 1.0
    polygons: ["PolygonStop", "PolygonSlowdown"]
    PolygonStop:
      type: "polygon"
      points: "[[0.15, 0.14], [0.15, -0.14], [-0.15, -0.14], [-0.15, 0.14]]"
      action_type: "approach"
      min_points: 2
      time_before_collision: 0.55
      simulation_time_step: 0.10
      visualize: true
      polygon_sub_topic: "polygon_stop"
    PolygonSlowdown:
      type: "polygon"
      points: "[[0.36, 0.23], [0.36, -0.23], [-0.20, -0.23], [-0.20, 0.23]]"
      action_type: "slowdown"
      min_points: 2
      slowdown_ratio: 0.65
      visualize: true
      polygon_sub_topic: "polygon_slowdown"
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_range: 0.08
