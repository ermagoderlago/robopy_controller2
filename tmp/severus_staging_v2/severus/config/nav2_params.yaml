controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 2.0  # Reduced for Pi 5 stability
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]
    costmap_update_timeout: 1.0
    use_realtime_priority: false

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15 # Movimento minimo richiesto (m) per non dichiarare stallo
      movement_time_allowance: 5.0   # Tolleranza di stallo accorciata (5s) per reattività su ostacoli invisibili

    # Goal checker
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.25
      stateful: True

    # Controller (MPPI) ottimizzato per robot cingolato non olonomo
    FollowPath:
      plugin: "nav2_mppi_controller::MppiController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000 # Ridotto per CPU/RAM Pi 5 (default 2000)
      vx_std: 0.2
      vy_std: 0.0      # Zero: impedisce moti laterali olonomi
      wz_std: 0.4
      vx_max: 0.4      # Limite max vel.
      vx_min: -0.2     # Permesso piccolo backup morbido
      wz_max: 0.6
      kinematics:
        base_min_turning_radius: 0.2  # ENFORCE: il robot non può ruotare sul posto, deve fare curve (skid steer dolce)
      critics:
        ConstraintCritic: {cost_power: 1, cost_weight: 4.0}
        GoalCritic: {cost_power: 1, cost_weight: 5.0, threshold_to_consider: 1.4}
        GoalAngleCritic: {cost_power: 1, cost_weight: 3.0, threshold_to_consider: 0.5}
        ObstaclesCritic: {cost_power: 1, cost_weight: 30.0, repulsion_weight: 1.5}
        PathAlignCritic: {cost_power: 1, cost_weight: 14.0}
        PathFollowCritic: {cost_power: 1, cost_weight: 5.0}
        PathAngleCritic: {cost_power: 1, cost_weight: 2.0}
        PreferForwardCritic: {cost_power: 1, cost_weight: 5.0}
      
planner_server:
  ros__parameters:
    expected_planner_frequency: 2.0  # Reduced for Pi 5 stability
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      downsample_costmap: true         # Fondamentale per salvare RAM sul Raspberry Pi 5
      downsampling_factor: 2
      tolerance: 0.5
      allow_unknown: true
      max_iterations: -1
      max_on_approach_iterations: 1000
      max_planning_time: 3.0
      motion_model_for_search: "REEDS_SHEPP" # Permette marcia avanti e indietro in stile auto
      angle_quantization_bins: 72 # Step da 5 gradi per bilanciare RAM e fluidità
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.2    # Vincoliamo anche qui il raggio minimo (NO SPIN)
      reverse_penalty: 2.0
      change_penalty: 0.05
      non_straight_penalty: 1.2

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "wait"]
    cycle_frequency: 10.0
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 1.0
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.1
    rotational_acc_lim: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 1.0
      rolling_window: true
      always_send_full_costmap: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.15
      plugins: ["obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      # ESEMPIO OTTIMIZZATO PER 4GB RAM CON POINTCLOUD2 (DEPTH CAMERA) 
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: True
      #   publish_voxel_map: False    # Cruciale: evita allocazioni massicce di RAM/Bandwidth
      #   origin_z: 0.0
      #   z_resolution: 0.2           # Voxel grossolani (20cm) -> N pixel = 1/0.2 = 5 strati (leggerissimo)
      #   z_voxels: 5
      #   max_obstacle_height: 1.0
      #   mark_threshold: 0
      #   observation_sources: pointcloud
      #   pointcloud:
      #     topic: "/camera/depth/points"
      #     max_obstacle_height: 1.0
      #     clearing: True
      #     marking: True
      #     data_type: "PointCloud2"
      #     raytrace_max_range: 2.0   # Scarsa profondità previene CPU raytrace pesante e RAM footrprint
      #     raytrace_min_range: 0.2
      #     obstacle_max_range: 1.8
      #     obstacle_min_range: 0.2
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
  
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 1.0
      always_send_full_costmap: true
      robot_radius: 0.15
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "turtlebot3_world.yaml"

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ['controller_server', 'bt_navigator', 'planner_server', 'behavior_server']