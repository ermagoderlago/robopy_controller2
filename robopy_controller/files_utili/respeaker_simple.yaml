################################################################################
#  ReSpeaker Lite — Firmware ESPHome (VERSIONE SEMPLIFICATA PER TEST)
#  Hardware: Seeed XIAO ESP32S3 + ReSpeaker 2-Mic Lite
#  Nota: Versione ridotta per debug compilazione
################################################################################

esphome:
  name: respeaker-lite
  friendly_name: ReSpeaker Lite del Robot

esp32:
  board: esp32s3box
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false

api:
ota:
  platform: esphome

logger:
  level: INFO

# ── UART bidirezionale ───────────────────────────────────────────────────
uart:
  id: uart_ros
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 115200
  rx_buffer_size: 256

# ── LED WS2812 ──────────────────────────────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO21
    num_leds: 1
    rmt_channel: 0
    id: respeaker_led
    name: "ReSpeaker LED"
    restore_mode: ALWAYS_OFF

# ── Pulsante BOOT ────────────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    id: button_wifi
    name: "Toggle WiFi"

# ── Intervalli ──────────────────────────────────────────────────────────
interval:
  - interval: 5s
    then:
      - uart.write:
          id: uart_ros
          data: "HEARTBEAT\n"
