################################################################################
#  ReSpeaker Lite — Firmware ESPHome (ESP-IDF + Wake Word)
#  Hardware: Seeed XIAO ESP32S3 + ReSpeaker 2-Mic Lite
#  ESPHome version: 2024.12.0
#
#  UART via USB CDC (115200 baud)
#  Protocollo: linee ASCII terminate da \n
#  RX: TRIGGER_JARVIS, HEARTBEAT_REQ, STATO, PAUSA, RIPRENDI, LED_*
#  TX: HEARTBEAT, TRIGGER_JARVIS, STATO:ww=N,led=R:G:B, AUDIO_LEVEL:N
################################################################################

esphome:
  name: respeaker-lite
  friendly_name: ReSpeaker Lite del Robot
  on_boot:
    priority: 600
    then:
      - light.turn_off: respeaker_led

esp32:
  board: esp32s3box
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      COMPILER_CXX_EXCEPTIONS: y
      CONFIG_LWIP_IPV6: n

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false

api:
ota:
  platform: esphome

logger:
  level: INFO

# ── Variabili globali ───────────────────────────────────────────────────
globals:
  - id: wake_word_enabled
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: wifi_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: led_r
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_g
    type: int
    restore_value: no
    initial_value: '0'
  - id: led_b
    type: int
    restore_value: no
    initial_value: '0'

  # Buffer ricezione UART
  - id: uart_rx_buf
    type: std::string
    restore_value: no
    initial_value: '""'

# ── UART bidirezionale ───────────────────────────────────────────────────
uart:
  id: uart_ros
  tx_pin: GPIO1
  rx_pin: GPIO2
  baud_rate: 115200
  rx_buffer_size: 256

# ── LED WS2812 ──────────────────────────────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    chipset: WS2812
    rgb_order: GRB
    pin: GPIO21
    num_leds: 1
    rmt_channel: 0
    id: respeaker_led
    name: "ReSpeaker LED"
    restore_mode: ALWAYS_OFF
    effects:
      - pulse:
          name: "Respiro"
          transition_length: 800ms
          update_interval: 800ms
          min_brightness: 5%
          max_brightness: 100%
      - flicker:
          name: "Flicker"
          alpha: 0.95
          intensity: 1.5%
      - strobe:
          name: "Lampeggio"
          colors:
            - state: true
              brightness: 100%
              duration: 150ms
            - state: false
              duration: 100ms

# ── Script LED ──────────────────────────────────────────────────────
script:
  - id: script_wake_led
    mode: restart
    then:
      - light.turn_on:
          id: respeaker_led
          red: 0%
          green: 100%
          blue: 100%
          brightness: 100%
          transition_length: 0ms
      - delay: 150ms
      - light.turn_off:
          id: respeaker_led
          transition_length: 0ms
      - delay: 80ms
      - light.turn_on:
          id: respeaker_led
          red: 0%
          green: 100%
          blue: 100%
          brightness: 100%
          transition_length: 0ms
      - delay: 150ms
      - light.turn_off:
          id: respeaker_led
          transition_length: 0ms

  - id: script_process_cmd
    mode: queued
    then:
      - lambda: |-
          std::string &cmd = id(uart_rx_buf);
          if (cmd.empty()) return;
          ESP_LOGD("uart_rx", "CMD: %s", cmd.c_str());

          // Helper set LED
          auto set_led = [](int r, int g, int b) {
            id(led_r) = r; id(led_g) = g; id(led_b) = b;
            auto call = id(respeaker_led).turn_on();
            call.set_rgb(r / 255.0f, g / 255.0f, b / 255.0f);
            call.set_brightness(1.0f);
            call.set_transition_length(0);
            call.perform();
          };

          // Helper write UART
          auto uart_write = [](const std::string &s) {
            id(uart_ros).write_array(
              reinterpret_cast<const uint8_t*>(s.c_str()), s.length()
            );
          };

          if (cmd == "HEARTBEAT_REQ") {
            uart_write("HEARTBEAT\n");

          } else if (cmd == "STATO") {
            char buf[64];
            snprintf(buf, sizeof(buf), "STATO:ww=%d,led=%d:%d:%d\n",
                     id(wake_word_enabled) ? 1 : 0,
                     id(led_r), id(led_g), id(led_b));
            uart_write(std::string(buf));

          } else if (cmd.rfind("LED_RGB:", 0) == 0) {
            int r = 0, g = 0, b = 0;
            if (sscanf(cmd.c_str() + 8, "%d,%d,%d", &r, &g, &b) == 3) {
              set_led(r, g, b);
            }

          } else if (cmd == "LED_OFF") {
            id(led_r) = 0; id(led_g) = 0; id(led_b) = 0;
            id(respeaker_led).turn_off().perform();

          } else if (cmd == "LED_BLU") {
            set_led(0, 0, 255);

          } else if (cmd.rfind("LED_EFFECT:", 0) == 0) {
            std::string eff = cmd.substr(11);
            if (eff == "IDLE") {
              auto call = id(respeaker_led).turn_on();
              call.set_effect("Respiro");
              call.set_rgb(1.0f, 1.0f, 1.0f);
              call.perform();
            } else if (eff == "LISTENING") {
              auto call = id(respeaker_led).turn_on();
              call.set_effect("Respiro");
              call.set_rgb(0.0f, 1.0f, 0.2f);
              call.perform();
            } else if (eff == "THINKING") {
              auto call = id(respeaker_led).turn_on();
              call.set_effect("Flicker");
              call.set_rgb(0.0f, 0.4f, 1.0f);
              call.perform();
            } else if (eff == "SUCCESS") {
              set_led(0, 255, 80);
            } else if (eff == "ERROR") {
              auto call = id(respeaker_led).turn_on();
              call.set_effect("Lampeggio");
              call.set_rgb(1.0f, 0.0f, 0.0f);
              call.perform();
            } else if (eff == "WAKE_WORD") {
              id(script_wake_led).execute();
            }

          } else if (cmd == "PAUSA") {
            id(wake_word_enabled) = false;
            id(mww).stop();
            set_led(255, 120, 0);

          } else if (cmd == "RIPRENDI") {
            id(wake_word_enabled) = true;
            id(mww).start();
            id(respeaker_led).turn_off().perform();
            id(led_r) = 0; id(led_g) = 0; id(led_b) = 0;

          } else {
            ESP_LOGW("uart_rx", "Comando non riconosciuto: %s", cmd.c_str());
          }
          id(uart_rx_buf) = "";

# ── I2S Audio / Microfono ───────────────────────────────────────────────
i2s_audio:
  i2s_lrclk_pin: GPIO8
  i2s_bclk_pin: GPIO7

microphone:
  - platform: i2s_audio
    id: respeaker_mic
    i2s_din_pin: GPIO9
    adc_type: external
    pdm: false

# ── Wake Word ────────────────────────────────────────────────────────────
micro_wake_word:
  id: mww
  microphone: respeaker_mic
  models:
    - model: hey_jarvis
      probability_cutoff: 0.90
  on_wake_word_detected:
    then:
      - script.execute: script_wake_led
      - uart.write:
          id: uart_ros
          data: "TRIGGER_JARVIS\n"
      - logger.log: "Wake word: JARVIS"
      - delay: 300ms
      - light.turn_on:
          id: respeaker_led
          red: 0%
          green: 100%
          blue: 20%
          brightness: 80%
          transition_length: 200ms
      - delay: 2s
      - light.turn_off:
          id: respeaker_led

# ── Pulsante BOOT ────────────────────────────────────────────────────────
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    id: button_wifi
    name: "Toggle WiFi"
    filters:
      - delayed_on: 50ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(wifi_active);'
            then:
              - lambda: 'id(wifi_active) = false;'
              - wifi.disable:
              - light.turn_on:
                  id: respeaker_led
                  red: 100%
                  green: 0%
                  blue: 0%
                  brightness: 100%
                  transition_length: 0ms
              - uart.write:
                  id: uart_ros
                  data: "WIFI_OFF\n"
              - delay: 1s
              - light.turn_off: respeaker_led
            else:
              - lambda: 'id(wifi_active) = true;'
              - wifi.enable:
              - light.turn_on:
                  id: respeaker_led
                  red: 0%
                  green: 0%
                  blue: 100%
                  brightness: 100%
                  transition_length: 0ms
              - uart.write:
                  id: uart_ros
                  data: "WIFI_ON\n"
              - delay: 1s
              - light.turn_off: respeaker_led

# ── Intervalli ──────────────────────────────────────────────────────────
interval:
  # Heartbeat ogni 5s
  - interval: 5s
    then:
      - uart.write:
          id: uart_ros
          data: "HEARTBEAT\n"

  # UART RX polling ogni 50ms
  - interval: 50ms
    then:
      - lambda: |-
          while (id(uart_ros).available()) {
            uint8_t byte;
            id(uart_ros).read_byte(&byte);
            if (byte == '\n' || byte == '\r') {
              // Rimuovi eventuali spazi
              std::string &buf = id(uart_rx_buf);
              while (!buf.empty() && (buf.back() == ' ')) buf.pop_back();
              if (!buf.empty()) {
                id(script_process_cmd).execute();
              }
            } else {
              id(uart_rx_buf) += (char)byte;
            }
          }
