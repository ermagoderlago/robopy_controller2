rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    database_path: "/mnt/ssd/rtabmap.db"  # [FM-NAV-020 & Core Rule 5] Salvaguardia MicroSD su NVMe SSD

    # Sorgenti dati
    subscribe_rgb: true
    subscribe_depth: true
    subscribe_scan: true         # Abilitato RPLIDAR C1 360° (/scan)
    subscribe_odom_info: false   # VIO non espone odom_info
    octomap: false               # Disabilita OctoMap 3D (No STVL / No 3D Octomap su Pi 5)

    # Sincronizzazione
    approx_sync: true
    queue_size: 20

    # TF
    publish_tf: true             # RTAB-Map è l'autorità map→odom

    # Creazione nodi
    Rtabmap/CreateIntermediateNodes: "false"
    Mem/NotLinkedNodesKept: "true"
    Mem/SaveRawData: "false"
    Mem/IncrementalMemory: "true"  # Modalità Mappatura attiva per nuova scansione 360° LiDAR + Depth

    # Timing e performance (RPi5 4GB)
    Rtabmap/TimeThr: "0"
    Rtabmap/MemoryThr: "300"
    Rtabmap/DetectionRate: "2.0"  # 2.0 Hz — campionamento più fitto per curve stabili

    # RGBD
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityAngle: "360"     # Abilita proximity loop a 360° con LiDAR indipendentemente dall'orientamento
    RGBD/LocalRadius: "3.5"        # Raggio ricerca prossimità esteso a 3.5m per coprire l'intera stanza
    RGBD/ProximityGlobalScanMap: "true" # Match ICP contro la submap locale aggregata (massima stabilità 2D LiDAR)
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/AngularUpdate: "0.15"     # ~8.6° di rotazione minima (ammorbidisce inserimento nodi e previene jitter TF)
    RGBD/LinearUpdate: "0.15"      # 15cm di traslazione minima
    RGBD/OptimizeMaxError: "0"     # Disabilita rigetto spurio del loop closure: ICP fa validazione metrica diretta
    RGBD/LoopClosureRejectionWithGraph: "false" # Validazione geometrica affidata a corrispondenze ICP LiDAR

    # Ottimizzatore grafo
    Optimizer/Strategy: "1"       # GTSAM
    Optimizer/Iterations: "30"
    Optimizer/Slam2D: "true"

    # Griglia occupancy con fusione Multi-Sensore (LiDAR 360° + 2.5D Depth Camera)
    Grid/RangeMin: "0.05"
    Grid/RangeMax: "16.0"
    Grid/Sensor: "2"              # 2 = Both (LiDAR 2D 360° + Depth Camera 3D)
    Grid/FromDepth: "false"       # false = Usa lo scan LiDAR come base metrica primaria
    Grid/3D: "false"
    Grid/RayTracing: "true"
    Grid/MaxObstacleHeight: "1.5"
    Grid/MaxGroundHeight: "0.05"
    Grid/MinGroundHeight: "-0.50"
    Grid/MinClusterSize: "10"
    Grid/NormalsSegmentation: "false"
    Grid/FootprintLength: "0.22"
    Grid/FootprintWidth: "0.18"
    Grid/FootprintHeight: "0.10"

    # Loop Closure — DBoW3 nativo C++ (ORB/FAST) (FM-NAV-016)
    Kp/MaxFeatures: "1000"
    Kp/MinFeatures: "30"          # Scarta frame con meno di 30 feature visive (guardrail pareti spoglie)
    Kp/DetectorStrategy: "8"      # 8 = ORB / FAST (DBoW3 nativo C++)
    Kp/RoiRatios: "0.0 0.0 0.10 0.0" # Taglia il 10% inferiore dell'immagine (evita falsi match su riflessi/texture pavimento)
    Vis/FeatureType: "6"          # GFTT/BRIEF — veloce su RPi5
    Vis/MinInliers: "10"          # Calibrato per OAK-D Lite depth range (evita scarto spurio loop validi)
    Vis/InlierDistance: "0.15"    # Tolleranza rumore stereoscopico depth
    Vis/PnPReprojError: "2.5"     # Tolleranza riproiezione PnP rigida contro aliasing percettivo
    Vis/CorType: "0"              # Features nativo C++
    Rtabmap/LoopThr: "0.20"       # Soglia di similarità innalzata a 0.20 (previene falsi loop in corridoi simmetrici)
    RGBD/LoopClosureReextractFeatures: "true"

    # Registrazione e Allineamento Scan Matching (LiDAR 2D ICP Loop Closure & Continuous Tracking)
    Reg/Strategy: "1"            # 1 = ICP (massima robustezza: loop closure geometrico diretto 360° da LiDAR ToF)
    Reg/Force3DoF: "true"
    RGBD/NeighborLinkRefining: "true" # CRITICO: Corregge continuamente l'odometria ad ogni scansione laser con ICP
    Icp/Strategy: "0"            # 0 = Point-to-Point 2D standard veloce
    Icp/PointToPlane: "false"    # Point-to-point per scan 2D planare senza normali
    Icp/VoxelSize: "0.03"        # 3cm voxel filtering per match laser accurato
    Icp/MaxCorrespondenceDistance: "0.35" # 35cm bacino di cattura ICP per correggere l'accumulo in rotazione
    Icp/CorrespondenceRatio: "0.20"       # Almeno il 20% di punti laser allineati per accettare la posa
    Icp/MaxTranslation: "0.50"   # Tolleranza correzione traslazione fino a 50cm
    Icp/MaxRotation: "0.78"      # Tolleranza correzione rotazione fino a 45° (~0.78 rad)
    Icp/Iterations: "40"
    Icp/OutlierRatio: "0.85"

