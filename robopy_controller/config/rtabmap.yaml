rgbd_odometry:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    publish_tf: true
    wait_for_transform: 0.2
    approx_sync: true
    queue_size: 5
    Odom/Strategy: "0"
    Odom/ResetCountdown: "1"
    Odom/GuessSmoothingDelay: "0.5"
    Vis/FeatureType: "6"
    Vis/MaxFeatures: "500"
    Vis/MinInliers: "20"
    Vis/InlierDistance: "0.05"
    Reg/Strategy: "1"
    Icp/VoxelSize: "0.05"
    Icp/PointToPlane: "true"
    Icp/Iterations: "5"
    Icp/Epsilon: "0.001"
    Reg/Force3DoF: "true"

rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_rgb: true
    subscribe_depth: true
    subscribe_odom_info: false
    approx_sync: true
    queue_size: 5
    publish_tf: true
    Rtabmap/CreateIntermediateNodes: "false"
    Mem/NotLinkedNodesKept: "false"
    Rtabmap/TimeThr: "500"
    RGBD/ProximityBySpace: "true"
    RGBD/AngularUpdate: "0.1"
    RGBD/LinearUpdate: "0.2"
    RGBD/OptimizeMaxError: "3.0"
    Optimizer/Strategy: "1"
    Optimizer/Iterations: "30"
    Grid/RangeMax: "3.5"
    Grid/MaxGroundHeight: "0.03"
    Grid/MinGroundHeight: "-0.50"
    Grid/MinClusterSize: "20"
    Grid/NormalsSegmentation: "false"
    Kp/MaxFeatures: "1000"
    Vis/FeatureType: "6"
    Rtabmap/LoopThr: "0.08"
    RGBD/LoopClosureReextractFeatures: "true"
    Reg/Force3DoF: "true"
    Optimizer/Slam2D: "true"
