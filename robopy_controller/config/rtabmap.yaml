rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"

    # Sorgenti dati
    subscribe_rgb: true
    subscribe_depth: true
    subscribe_scan: true
    subscribe_odom_info: false   # VIO non espone odom_info

    # Sincronizzazione
    approx_sync: true
    queue_size: 5

    # TF
    publish_tf: true             # RTAB-Map è l'autorità map→odom

    # Creazione nodi
    Rtabmap/CreateIntermediateNodes: "false"
    Mem/NotLinkedNodesKept: "true"
    Mem/SaveRawData: "false"
    Mem/IncrementalMemory: "true"

    # Timing e performance (RPi5 4GB)
    Rtabmap/TimeThr: "0"
    Rtabmap/MemoryThr: "300"
    Rtabmap/DetectionRate: "2.0"  # 2 Hz — bilanciamento qualità/CPU

    # RGBD
    RGBD/ProximityBySpace: "true"
    RGBD/AngularUpdate: "0.087"   # ~5° di rotazione minima per nuovo nodo
    RGBD/LinearUpdate: "0.10"     # 10cm di traslazione minima
    RGBD/OptimizeMaxError: "3.0"

    # Ottimizzatore grafo
    Optimizer/Strategy: "1"       # GTSAM
    Optimizer/Iterations: "30"
    Optimizer/Slam2D: "true"

    # Griglia occupancy
    Grid/RangeMin: "0.25"
    Grid/RangeMax: "5.0"
    Grid/Sensor: "2"              # depth camera
    Grid/RayTracing: "true"
    Grid/MaxObstacleHeight: "1.5"
    Grid/MaxGroundHeight: "0.05"
    Grid/MinGroundHeight: "-0.50"
    Grid/MinClusterSize: "10"
    Grid/NormalsSegmentation: "false"
    Grid/FootprintLength: "0.22"
    Grid/FootprintWidth: "0.18"
    Grid/FootprintHeight: "0.10"

    # Loop Closure — DBoW2 nativo C++ (NO SuperPoint Python)
    Kp/MaxFeatures: "1000"
    Vis/FeatureType: "6"          # GFTT/BRIEF — veloce su RPi5
    Vis/MinInliers: "20"
    Vis/CorType: "0"              # Features nativo (NO SuperPoint)
    Rtabmap/LoopThr: "0.15"
    RGBD/LoopClosureReextractFeatures: "true"

    # 3DoF forzato (robot 2D)
    Reg/Force3DoF: "true"
