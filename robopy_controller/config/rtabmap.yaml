rtabmap:
  ros__parameters:
    frame_id: "base_link"
    odom_frame_id: "odom"
    map_frame_id: "map"
    database_path: "/mnt/ssd/rtabmap.db"  # [FM-NAV-020 & Core Rule 5] Salvaguardia MicroSD su NVMe SSD

    # Sorgenti dati
    subscribe_rgb: true
    subscribe_depth: true
    subscribe_scan: true         # Abilitato RPLIDAR C1 360° (/scan)
    subscribe_odom_info: false   # VIO non espone odom_info
    octomap: false               # Disabilita OctoMap 3D (No STVL / No 3D Octomap su Pi 5)

    # Sincronizzazione
    approx_sync: true
    queue_size: 20

    # TF
    publish_tf: true             # RTAB-Map è l'autorità map→odom

    # Creazione nodi
    Rtabmap/CreateIntermediateNodes: "false"
    Mem/NotLinkedNodesKept: "true"
    Mem/SaveRawData: "false"
    Mem/IncrementalMemory: "true"  # Modalità Mappatura attiva per nuova scansione 360° LiDAR

    # Timing e performance (RPi5 4GB)
    Rtabmap/TimeThr: "0"
    Rtabmap/MemoryThr: "300"
    Rtabmap/DetectionRate: "1.0"  # 1.0 Hz — conforme a SPEC-02 Zona Verde (protezione CPU Pi 5)

    # Prossimità 2D LiDAR (Loop closure geometrico puro, 0 dipendenza dalla camera)
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityAngle: "360"     # Abilita proximity loop a 360° con LiDAR indipendentemente dall'orientamento
    RGBD/LocalRadius: "3.5"        # Raggio ricerca prossimità esteso a 3.5m per coprire l'intera stanza
    RGBD/ProximityGlobalScanMap: "false" # Match locale pulito nodo-su-nodo (evita distorsioni da accumulo nuvola globale)
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/ProximityMaxGraphDepth: "0"
    RGBD/AngularUpdate: "0.15"     # ~8.5° di rotazione minima (frequenza ottimale keyframes)
    RGBD/LinearUpdate: "0.15"      # 15cm di traslazione minima
    RGBD/OptimizeMaxError: "0"     # Disabilita rigetto spurio del loop closure: ICP fa validazione metrica diretta
    RGBD/LoopClosureRejectionWithGraph: "false"

    # Ottimizzatore grafo
    Optimizer/Strategy: "1"       # GTSAM
    Optimizer/Iterations: "30"
    Optimizer/Slam2D: "true"

    # Griglia occupancy PURA da LiDAR RPLIDAR C1 (Zero rumore stereo depth, perfetta al buio)
    Grid/RangeMin: "0.05"
    Grid/RangeMax: "12.0"         # Range nominale RPLIDAR C1 ToF
    Grid/Sensor: "0"              # 0 = Laser scan ONLY (elimina i falsi punti stereo e funziona al buio)
    Grid/FromDepth: "false"       # false = Usa lo scan LiDAR come base metrica primaria
    Grid/3D: "false"
    Grid/RayTracing: "true"
    Grid/MaxObstacleHeight: "1.5"
    Grid/MaxGroundHeight: "0.05"
    Grid/MinGroundHeight: "-0.50"
    Grid/MinClusterSize: "10"
    Grid/NormalsSegmentation: "false"
    Grid/FootprintLength: "0.22"
    Grid/FootprintWidth: "0.18"
    Grid/FootprintHeight: "0.10"

    # Feature visive azzerate: SLAM 100% indipendente dalla luce (funziona al buio completo)
    Kp/MaxFeatures: "0"           # Disabilita vincolo visivo
    Kp/MinFeatures: "0"           # Accetta frame con 0 feature visive (buio pesto)
    Kp/DetectorStrategy: "8"
    Rtabmap/LoopThr: "0.20"

    # Registrazione e Scan Matching: PURE 2D LIDAR ICP (Point-to-Point)
    # [FM-NAV-028 v3] Point-to-Point ICP: immune al "corridor sliding" che affligge Point-to-Plane
    # su muri rettilinei. Point-to-Plane ha costo zero lungo l'asse del muro → scivolamento
    # longitudinale incontrollato. Point-to-Point misura distanze assolute punto-punto →
    # vincolo efficace in TUTTE le direzioni, inclusa la traslazione avanti/indietro.
    Reg/Strategy: "1"            # 1 = PURE ICP LiDAR (Zero dipendenza da camera, perfetto al buio)
    Reg/Force3DoF: "true"        # Vincolo rigoroso sul piano 2D (x, y, yaw)
    RGBD/NeighborLinkRefining: "true"  # ICP tra ogni coppia di frame consecutivi: corregge drift odometrico in tempo reale
    Icp/Strategy: "0"            # 0 = Standard Point-to-Point ICP
    Icp/PointToPlane: "false"    # CRITICO: Point-to-Point (NON Point-to-Plane) per eliminare corridor sliding
    Icp/VoxelSize: "0.02"        # 2cm voxel filtering per match laser accurato
    Icp/MaxCorrespondenceDistance: "0.25" # 25cm bacino di cattura (stretto: impedisce snap su pareti parallele)
    Icp/CorrespondenceRatio: "0.30"       # 30% corrispondenze minime (più selettivo contro falsi positivi)
    Icp/MaxTranslation: "0.20"   # Max correzione traslazione 20cm/frame (impedisce salti catastrofici)
    Icp/MaxRotation: "0.35"      # Max correzione rotazione ~20°/frame (impedisce rotazioni fantasma)
    Icp/Iterations: "40"
    Icp/OutlierRatio: "0.65"     # 65% outlier tolerance (più selettivo con Point-to-Point)
    Icp/Epsilon: "0.001"

