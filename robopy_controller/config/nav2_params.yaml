    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
    default_bt_xml_filename: "/home/robopy/ros2_jazzy/install/nav2_bt_navigator/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
