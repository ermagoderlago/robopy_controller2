# nav2_params_jazzy.yaml
# Profilo Nav2 ottimizzato per Raspberry Pi 5 con 4GB RAM
#
# Caratteristiche principali:
# - Regulated Pure Pursuit (RPP) al posto di DWB: -70% CPU
# - ObstacleLayer 2D al posto di VoxelLayer 3D: -50% RAM
# - Risoluzione costmap 0.1m: 4x meno celle rispetto a 0.05m
# - Nessun AMCL: RTAB-Map fornisce già la localizzazione (map→odom)
# - use_sim_time: false ovunque

# ============================================================
# BT NAVIGATOR
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Usa i behavior tree di default di Nav2

# ============================================================
# CONTROLLER SERVER — Regulated Pure Pursuit (RPP)
# RPP è molto più leggero di DWB perché non fa sampling di
# molteplici traiettorie. Segue il path con un lookahead point.
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # 10Hz — sufficiente per robot indoor lento
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker: rileva se il robot è bloccato
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker: tolleranza arrivo al goal
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # RPP — Regulated Pure Pursuit Controller
    # Molto più leggero di DWB, ideale per robot differenziale
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5          # Velocità lineare desiderata
      lookahead_dist: 0.6              # Distanza lookahead point
      min_lookahead_dist: 0.3          # Min lookahead
      max_lookahead_dist: 0.9          # Max lookahead
      lookahead_time: 1.5              # Tempo lookahead adattivo
      rotate_to_heading_angular_vel: 1.0  # Vel angolare per rotazione verso heading
      transform_tolerance: 0.1
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.25
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.25
      allow_reversing: false
      max_angular_accel: 3.2           # Accelerazione angolare max
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

# ============================================================
# LOCAL COSTMAP — Rolling window 3×3m, ObstacleLayer 2D
# Risoluzione 0.1m → 30×30 = 900 celle (vs 3600 a 0.05m)
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0    # Aggiornamento a 5Hz
      publish_frequency: 2.0   # Pubblicazione a 2Hz (risparmia bandwidth)
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 3                 # 3m larghezza
      height: 3                # 3m altezza
      resolution: 0.1          # 0.1m — 4x meno celle rispetto a 0.05m
      robot_radius: 0.12       # Raggio chassis Pi
      plugins: ["obstacle_layer", "inflation_layer"]

      # ObstacleLayer 2D — molto più leggero del VoxelLayer 3D
      # Si basa esclusivamente sul topic /scan (LaserScan)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ============================================================
# GLOBAL COSTMAP — Rolling window + obstacle + inflation
# NO static_layer: RTAB-Map builds map incrementally and may
# not have OccupancyGrid ready when Nav2 starts, causing
# planner_server configure to fail.
# Rolling window 5×5m provides enough planning area.
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      robot_radius: 0.12
      resolution: 0.1         # 0.1m — -75% RAM rispetto a 0.05m
      rolling_window: true
      width: 5                # 5m rolling window
      height: 5               # 5m rolling window
      track_unknown_space: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ============================================================
# PLANNER SERVER — NavfnPlanner (leggero)
# Frequenza di pianificazione: 1 Hz (sufficiente per indoor)
# ============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # 1Hz — -95% CPU rispetto a 20Hz
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false         # Dijkstra è più veloce per mappe piccole
      allow_unknown: true

# ============================================================
# BEHAVIOR SERVER (ex "recoveries_server" in Galactic)
# Solo spin e backup — niente wait per evitare stalli
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    # Parametri non aggressivi
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# ============================================================
# WAYPOINT FOLLOWER
# ============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
