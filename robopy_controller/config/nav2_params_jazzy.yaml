# nav2_params_jazzy.yaml
# Profilo Nav2 ottimizzato per Raspberry Pi 5 con 4GB RAM
#
# Caratteristiche principali:
# - Regulated Pure Pursuit (RPP) al posto di DWB: -70% CPU
# - ObstacleLayer 2D al posto di VoxelLayer 3D: -50% RAM
# - Risoluzione costmap 0.1m: 4x meno celle rispetto a 0.05m
# - Nessun AMCL: RTAB-Map fornisce già la localizzazione (map→odom)
# - use_sim_time: false ovunque

# ============================================================
# BT NAVIGATOR
# ============================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /rtabmap/odom
    transform_tolerance: 5.0
    bt_loop_duration: 10
    default_server_timeout: 40
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # USE CUSTOM SURVIVAL BT
    default_nav_to_pose_bt_xml: /home/robopy/robopy/robopi_controller/robopy_controller_host/robopy_controller/config/nav2_survival_bt.xml
    navigators: ['navigate_to_pose', 'navigate_through_poses']
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ============================================================
# CONTROLLER SERVER — Regulated Pure Pursuit (RPP)
# RPP è molto più leggero di DWB perché non fa sampling di
# molteplici traiettorie. Segue il path con un lookahead point.
# ============================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0  # 10Hz — sufficiente per robot indoor lento
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    # Progress checker: rileva se il robot è bloccato
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    # Goal checker: tolleranza arrivo al goal
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    # Controller (MPPI) ottimizzato per robot cingolato non olonomo
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.1
      batch_size: 1000 # Ridotto per CPU/RAM Pi 5 (default 2000)
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 1.2      # Campionamento più ampio per rotazioni
      vx_max: 0.5      # Aumentato per dare margine al PID
      vx_min: 0.0      # Zero: NESSUNA RETROMARCIA AMMESSA cieca
      wz_max: 2.0      # Raddoppiato per curve e rotazioni sul posto
      kinematics:
        base_min_turning_radius: 0.0  # Permetti rotazione sul posto (skid steer) per curve taglienti
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "ObstaclesCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        cost_power: 1
        cost_weight: 30.0
        repulsion_weight: 1.5
      PathAlignCritic:
        cost_power: 1
        cost_weight: 14.0
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
      PreferForwardCritic:
        cost_power: 1
        cost_weight: 50.0  # Penalità altissima per le retromarce cieche

# ============================================================
# LOCAL COSTMAP — Rolling window 3×3m, ObstacleLayer 2D
# Risoluzione 0.1m → 30×30 = 900 celle (vs 3600 a 0.05m)
# ============================================================
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 5.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.1
      robot_radius: 0.12
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ============================================================
# GLOBAL COSTMAP — Mappa statica + obstacle + inflation
# Risoluzione 0.1m per ridurre l'uso di RAM.
# Nessun VoxelLayer per risparmiare memoria.
# ============================================================
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 5.0
      robot_radius: 0.12
      resolution: 0.1
      track_unknown_space: true
      rolling_window: false
      width: 10
      height: 10
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

# ============================================================
# PLANNER SERVER — NavfnPlanner (Dijkstra)
# ============================================================
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0  # 1Hz — -95% CPU rispetto a 20Hz
    use_sim_time: false
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      allow_unknown: true
      use_astar: false

# ============================================================
# BEHAVIOR SERVER (ex "recoveries_server" in Galactic)
# Solo spin e backup — niente wait per evitare stalli
# ============================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 5.0
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    # Parametri per cingolato ad alto attrito
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.0
    min_rotational_vel: 0.8
    rotational_acc_lim: 3.2

# ============================================================
# WAYPOINT FOLLOWER
# ============================================================
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

