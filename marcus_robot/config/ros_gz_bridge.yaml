# Camera RGB (Gz -> ROS)
- ros_topic_name: "/oak/stereo/image_raw"
  gz_topic_name:  "/oak/stereo/image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera Depth 32FC1 (Gz -> ROS)
- ros_topic_name: "/oak/stereo/image_depth"
  gz_topic_name:  "/oak/stereo/depth_image"
  ros_type_name:  "sensor_msgs/msg/Image"
  gz_type_name:   "gz.msgs.Image"
  direction: GZ_TO_ROS

# Camera Info (Gz -> ROS)
- ros_topic_name: "/oak/stereo/camera_info"
  gz_topic_name:  "/oak/stereo/camera_info"
  ros_type_name:  "sensor_msgs/msg/CameraInfo"
  gz_type_name:   "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# Odometria (Gz -> ROS)
- ros_topic_name: "/odom"
  gz_topic_name:  "/model/marcus_bot/odometry"
  ros_type_name:  "nav_msgs/msg/Odometry"
  gz_type_name:   "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# Comando velocità (ROS -> Gz)
- ros_topic_name: "/cmd_vel"
  gz_topic_name:  "/model/marcus_bot/cmd_vel"
  ros_type_name:  "geometry_msgs/msg/Twist"
  gz_type_name:   "gz.msgs.Twist"
  direction: ROS_TO_GZ

# TF dal modello (Gz -> ROS)
- ros_topic_name: "/tf"
  gz_topic_name:  "/model/marcus_bot/tf"
  ros_type_name:  "tf2_msgs/msg/TFMessage"
  gz_type_name:   "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Clock simulazione
- ros_topic_name: "/clock"
  gz_topic_name:  "/clock"
  ros_type_name:  "rosgraph_msgs/msg/Clock"
  gz_type_name:   "gz.msgs.Clock"
  direction: GZ_TO_ROS
